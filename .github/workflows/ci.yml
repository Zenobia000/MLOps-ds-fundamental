# =============================================================================
# .github/workflows/ci.yml — 啟用版 CI（M5 教學範例的「真實 repo 根」版本）
# -----------------------------------------------------------------------------
# 這是 mlops-course/modules/m5-automation/sandbox/github-actions/ci.yml 的
# 「已啟用」版本：GitHub 只執行 repo 根 .github/workflows/ 下的 workflow，
# 所以教學範例要搬到這裡才會真的跑。路徑也對齊本 repo（沙盒測試在
# mlops-course/modules/m5-automation/sandbox/tests/）。
#
# 教學重點（與沙盒一致）：on（觸發）/ runs-on（在哪跑）/ steps（跑什麼）。
# pytest 一旦失敗，step 回傳非 0、整條 workflow 變紅 → 達成「壞 code 進不來」。
# =============================================================================

name: ci

on:
  push:
  pull_request:
  workflow_dispatch: # 允許在 Actions 頁面手動觸發

jobs:
  m5-sandbox-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run M5 sandbox tests (CI quality gate)
        run: |
          python -m pytest mlops-course/modules/m5-automation/sandbox/tests/ -v

  # ===========================================================================
  # 教學 notebook 的品質門檻。
  # 教材 repo 的 notebook 必須「每一本都能從頭到尾重跑」——做不到這點的 notebook，
  # 正是它自己在示範的壞味道。所以這裡做兩件事：
  #   1. nbstripout --verify：擋下帶著執行輸出的 notebook（否則 git diff 會爆炸）
  #   2. pytest --nbmake    ：真的把每一格跑一遍，壞掉就讓 CI 變紅
  # 介質選擇的判準（哪些單元該是 notebook）見 docs/notebook-vs-script.md。
  # ===========================================================================
  notebooks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install notebook toolchain and the deps those notebooks import
        run: |
          python -m pip install --upgrade pip
          # 只裝 4 本教學 notebook 真正 import 的東西（刻意不裝 feast/torch/bentoml，
          # 那些是 m3/m4 腳本的依賴，notebook 用不到，裝了只會拖慢 CI）。
          pip install pytest nbmake nbstripout \
                      scikit-learn pandas numpy matplotlib plotly optuna \
                      "evidently>=0.4,<0.5"

      - name: Verify no notebook carries committed outputs
        run: |
          nbstripout --verify $(git ls-files '*.ipynb')

      - name: Execute teaching notebooks (modules/)
        run: |
          python -m pytest --nbmake $(git ls-files 'mlops-course/modules/**/*.ipynb') -q

      - name: Execute capstone notebooks
        working-directory: mlops-course/capstone/smart-factory-mlops
        run: |
          python -m pytest --nbmake notebooks/ -q
