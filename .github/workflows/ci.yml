# =============================================================================
# .github/workflows/ci.yml — 啟用版 CI（M5 教學範例的「真實 repo 根」版本）
# -----------------------------------------------------------------------------
# 這是 mlops-course/modules/m5-automation/sandbox/github-actions/ci.yml 的
# 「已啟用」版本：GitHub 只執行 repo 根 .github/workflows/ 下的 workflow，
# 所以教學範例要搬到這裡才會真的跑。路徑也對齊本 repo（沙盒測試在
# mlops-course/modules/m5-automation/sandbox/tests/）。
#
# 教學重點（與沙盒一致）：on（觸發）/ runs-on（在哪跑）/ steps（跑什麼）。
# pytest 一旦失敗，step 回傳非 0、整條 workflow 變紅 → 達成「壞 code 進不來」。
# =============================================================================

name: ci

on:
  push:
  pull_request:
  workflow_dispatch: # 允許在 Actions 頁面手動觸發

jobs:
  m5-sandbox-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # 不需要 actions/setup-python：uv 會依 mlops-course/.python-version 自動取得 3.11，
      # 跟學生本機拿到的是同一個版本來源。
      #
      # 用 uv.lock 裝，CI 才會跟學生拿到「完全相同的版本」。
      # --frozen：lock 與 pyproject.toml 不一致就直接失敗，不會偷偷重解版本。
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies from uv.lock
        working-directory: mlops-course
        run: uv sync --extra dev --frozen

      - name: Run M5 sandbox tests (CI quality gate)
        working-directory: mlops-course
        run: uv run --frozen python -m pytest modules/m5-automation/sandbox/tests/ -v

  # ===========================================================================
  # 教學 notebook 的品質門檻。
  # 教材 repo 的 notebook 必須「每一本都能從頭到尾重跑」——做不到這點的 notebook，
  # 正是它自己在示範的壞味道。所以這裡做兩件事：
  #   1. nbstripout --verify：擋下帶著執行輸出的 notebook（否則 git diff 會爆炸）
  #   2. pytest --nbmake    ：真的把每一格跑一遍，壞掉就讓 CI 變紅
  # 介質選擇的判準（哪些單元該是 notebook）見 docs/notebook-vs-script.md。
  # ===========================================================================
  notebooks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # 先前這裡是手寫一串 pip install，等於 CI 跟學生裝的不是同一套環境——
      # CI 綠不代表學生跑得動，反之亦然。改成從 uv.lock 裝，版本完全一致。
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync the locked course environment
        working-directory: mlops-course
        run: uv sync --extra dev --frozen

      # 直接跑學生會跑的同一組 make 指令——CI 與課堂上的行為不會分岔。
      # Makefile 的 PYTHON 變數偵測到 .venv 就會自動用它，不需要 activate。
      - name: Verify no notebook carries committed outputs
        working-directory: mlops-course
        run: make nb-verify

      - name: Execute teaching notebooks (modules/)
        working-directory: mlops-course
        run: make nb-test

      # capstone 用課程環境跑：它的 notebook 只 import pandas 層級的東西，
      # 不需要另外裝 capstone/smart-factory-mlops/pyproject.toml 那一套。
      - name: Execute capstone notebooks
        working-directory: mlops-course
        run: .venv/bin/python -m pytest --nbmake capstone/smart-factory-mlops/notebooks/ -q
