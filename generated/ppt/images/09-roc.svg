<svg xmlns="http://www.w3.org/2000/svg" viewBox="492 20 508 470" width="508" height="470" role="img" aria-label="ROC curve: a terracotta curve bulging toward the upper left, against a dashed diagonal baseline">
  <rect x="492" y="20" width="508" height="470" fill="#F0EEE6"/>

  <!-- plot frame: hairline axes only, bottom + left -->
  <g stroke="#141413" stroke-width="1.5" fill="none" opacity="0.55">
    <path d="M 560 60 L 560 440"/>
    <path d="M 560 440 L 940 440"/>
  </g>

  <!-- tick marks: 0 / .5 / 1 on both axes -->
  <g stroke="#141413" stroke-width="1.5" opacity="0.35">
    <path d="M 560 440 l -8 0"/>
    <path d="M 560 250 l -8 0"/>
    <path d="M 560 60  l -8 0"/>
    <path d="M 560 440 l 0 8"/>
    <path d="M 750 440 l 0 8"/>
    <path d="M 940 440 l 0 8"/>
  </g>

  <!-- chance line: 45 degree dashed diagonal = AUC 0.5 -->
  <path d="M 560 440 L 940 60" stroke="#141413" stroke-width="2" stroke-dasharray="7 7" fill="none" opacity="0.42"/>

  <!-- ROC curve: bulges toward the upper-left corner -->
  <path d="M 560 440 C 583 296, 640 154, 748 112 C 830 80, 892 68, 940 60"
        stroke="#D97757" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- area under the curve, very light terracotta wash -->
  <path d="M 560 440 C 583 296, 640 154, 748 112 C 830 80, 892 68, 940 60 L 940 440 Z"
        fill="#D97757" opacity="0.10"/>

  <!-- the perfect corner: small square anchor at top-left of the plot -->
  <rect x="552" y="52" width="16" height="16" fill="#D97757"/>

  <!-- chance anchor: hollow square on the diagonal midpoint -->
  <rect x="743" y="243" width="14" height="14" fill="none" stroke="#141413" stroke-width="2" opacity="0.5"/>

  <!-- left and right breathing blocks keep the plot in the centre safe area -->
</svg>
